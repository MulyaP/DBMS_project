<div class="table-wrap">
  <table>
    <thead>
      <tr>
        {% for h in headers %}
          <th>{{ h }}</th>
        {% endfor %}
      </tr>
    </thead>
    <tbody>
      {% for row in rows %}
        <tr>
          {% for cell in row %}
            <td>{{ cell }}</td>
          {% endfor %}
        </tr>
      {% else %}
        <tr>
          <td colspan="{{ headers|length or 1 }}" class="empty">No matching records.</td>
        </tr>
      {% endfor %}
    </tbody>
  </table>
</div>
